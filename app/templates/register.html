{% extends "base.html" %}

{% block title %}
Register - EasyApply
{% endblock %}

{% block content %}

<div class="form-container auth-card register-card">

    <span class="eyebrow">A FRESH START</span>
    <h1>Make room for your next move.</h1>

    <p class="form-subtitle">
        Create your account and bring your career search into focus.
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >
        </div>

        <div class="form-group">
            <label for="full_name">Full name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter your full name"
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
            >
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter your location"
            >
        </div>

        <div class="form-group">
            <label for="experience">Experience</label>
            <textarea
                id="experience"
                name="experience"
                placeholder="Describe your experience"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="education">Education</label>
            <textarea
                id="education"
                name="education"
                placeholder="Enter your education"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="preferred_roles">Preferred Roles</label>
            <textarea
                id="preferred_roles"
                name="preferred_roles"
                placeholder="Example: Python Developer, FastAPI Developer"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="preferred_locations">
                Preferred Locations
            </label>

            <textarea
                id="preferred_locations"
                name="preferred_locations"
                placeholder="Example: Hyderabad, Bangalore, Remote"
            ></textarea>
        </div>

        <button type="submit" class="btn">
            Register
        </button>

    </form>

    <p id="registerMessage"></p>

    <p class="form-footer">
        Already have an account?
        <a href="/login">Login here</a>
    </p>

</div>

{% endblock %}
